# nclawzero distro config for Cix Sky1 first-pass Yocto images.

require conf/distro/poky.conf

DISTRO = "nclawzero"
DISTRO_NAME = "nclawzero"
DISTRO_VERSION = "2026.04"
DISTRO_CODENAME = "scarthgap"
MAINTAINER = "Jason Perlow <jperlow@gmail.com>"

TARGET_VENDOR = "-nclawzero"
SDK_VENDOR = "-nclawzerosdk"

INIT_MANAGER = "systemd"
DISTRO_FEATURES:append = " systemd usrmerge"
# DISTRO_FEATURES_BACKFILL_CONSIDERED is the pre-6.0 name; keep it for scarthgap and
# add the 6.0+ replacement so this line works across both LAYERSERIES_COMPAT entries.
DISTRO_FEATURES_BACKFILL_CONSIDERED:append = " sysvinit"
DISTRO_FEATURES_OPTED_OUT:append = " sysvinit"

VIRTUAL-RUNTIME_init_manager = "systemd"
# systemd-compat-units was removed upstream in Yocto 6.0 (sysvinit-compat support
# dropped). We run pure systemd (INIT_MANAGER above) so no replacement is needed here
# -- verify on first real 6.0 build in case something still expects this virtual to
# resolve to a provider.

PACKAGE_CLASSES ?= "package_ipk"
