# rEFInd — NCZ-OS 2026.10.28-db2f2509 (generated by ncz-refind-refresh)
# Kernels live on the FAT ESP; each kernel's initramfs mounts the
# btrfs root. No btrfs/ext4 EFI driver is required.
timeout 10
log_level 0
use_nvram false
resolution max
banner ncz-banner.png
banner_scale noscale
include themes/cygnus/theme.conf
showtools shell,reboot,shutdown,firmware
scanfor manual
scan_all_linux_kernels false
default_selection "7.3 Mali (Default)"

menuentry "NCZ-OS 26.10 Cygnus  -  7.3 Mali (Default)" {
    loader  /vmlinuz-7.3.0-sky1-ncz
    icon    /EFI/BOOT/ncz.png
    initrd  /initrd.img-7.3.0-sky1-ncz
    options "root=PARTUUID=78a26ced-2e74-43c5-88c4-fb68fb20f203 rootwait rootfstype=btrfs rw rootflags=subvol=@rootfs console=ttyAMA0,115200 console=tty0  acpi=force systemd.condition_first_boot=false arm-smmu-v3.disable_bypass=0 audit_backlog_limit=8192 clk_ignore_unused module_blacklist=panthor,typec_rts5453,rts5453 pcie_aspm=off sky1_pcie_native=off pcie_pnp_en acpi_scmi_en=off loglevel=3 oops=panic panic=6 quiet loglevel=3 vt.global_cursor_default=0 systemd.show_status=false rd.systemd.show_status=false sky1.gpu=vendor"
}

